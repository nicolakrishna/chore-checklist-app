# Apache site for the chore sync server. Goes in
# /etc/apache2/sites-available/chores.conf (install step fills in CHORES_HOSTNAME);
# certbot adds the HTTPS copy.
# Only /config is passed through; WordPress's own sites are untouched.
<VirtualHost *:80>
    ServerName CHORES_HOSTNAME
    # empty folder, so nothing but /config is served (not WordPress)
    DocumentRoot /var/www/chores-empty

    ProxyPreserveHost On
    ProxyPass        /config http://127.0.0.1:8787/config
    ProxyPassReverse /config http://127.0.0.1:8787/config

    ErrorLog ${APACHE_LOG_DIR}/chores-error.log
    CustomLog ${APACHE_LOG_DIR}/chores-access.log combined
</VirtualHost>
